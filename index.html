<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gaussian probability ball</title>
<style>
:root{--bg:#f6f6f4;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#d9d9d3;--acc:#e8590c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--fg:#ecece8;--mut:#9a9a93;--card:#1f1f1d;--line:#3a3a36;--acc:#ff922b}}
:root[data-theme="dark"]{--bg:#141413;--fg:#ecece8;--mut:#9a9a93;--card:#1f1f1d;--line:#3a3a36;--acc:#ff922b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:4px 0 10px}
canvas{width:100%;aspect-ratio:1/1;display:block;border-radius:10px;border:1px solid var(--line);touch-action:none;background:#000}
.res{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
.res b{font-size:22px;color:var(--acc)}
.res small{color:var(--mut);display:block}
.row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.row button{flex:1;min-width:52px;padding:9px 4px;font-size:13px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-family:inherit}
.row button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.row button:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
label{display:block;font-size:13px;color:var(--mut)}
label span{float:right;color:var(--fg);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:2px 0 0}
.p{grid-column:1/3}
h2{font-size:14px;margin:14px 0 6px}
.hint{color:var(--mut);font-size:12px;margin-top:8px}
@media (min-width:860px){
  main{max-width:1180px;padding:18px 24px}
  #layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:24px;align-items:start}
  #left{position:sticky;top:12px;max-width:min(100%,calc(100vh - 210px))}
  #right h2:first-child{margin-top:0}
  .res{margin-top:12px}
}
</style>
</head>
<body>
<main>
<h1>Gaussian probability ball</h1>
<div class="row" id="modes"><button data-m="F" class="on">Forward (c)</button><button data-m="R">Reverse (x)</button><button data-m="P">p-occurrence</button></div>
<div id="layout"><div id="left"><canvas id="cv"></canvas>
<div class="res"><span id="lab">Radius</span> <b id="rad">–</b><small id="info"></small></div></div><div id="right">
<label class="p">Probability p <span id="vp"></span><input id="p" type="range" min="0.01" max="0.99" step="0.01" value="0.05"></label>
<label class="p" style="margin-top:8px">Zoom: half-width of the view <span id="vz"></span><input id="zoom" type="range" min="2" max="10" step="0.5" value="4"></label>
<label class="p" id="cl" style="display:none;margin-top:8px">Contour level (p-occurrence, 0 = off) <span id="vc"></span><input id="cont" type="range" min="0" max="1" step="0.01" value="0.9"></label>
<h2>Mixture components</h2>
<div class="row" id="chips"></div>
<div class="grid">
  <label class="p">Weight <span id="vw"></span><input id="w" type="range" min="0.1" max="3" step="0.1" value="1"></label>
  <label>Mean x <span id="vmx"></span><input id="mx" type="range" min="-6" max="6" step="0.1" value="0"></label>
  <label>Mean y <span id="vmy"></span><input id="my" type="range" min="-6" max="6" step="0.1" value="0"></label>
  <label>Sigma x <span id="vsx"></span><input id="sx" type="range" min="0.3" max="3" step="0.1" value="1.5"></label>
  <label>Sigma y <span id="vsy"></span><input id="sy" type="range" min="0.3" max="3" step="0.1" value="1"></label>
  <label class="p">Correlation rho <span id="vrho"></span><input id="rho" type="range" min="-0.95" max="0.95" step="0.05" value="0.4"></label>
</div>
<div class="row" style="margin-top:10px"><button id="add">+ Add component</button><button id="del">Remove this one</button></div>
</div></div>
<div class="hint">Tap or drag on the plot to move the active point (c in forward mode, x in the other two). p-occurrence of x = mixture probability of its reverse ball. Weights are normalised automatically.</div>
</main>
<script>
let L=4;const GX=120,MAXK=6;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const comps=[{w:1,mx:0,my:0,sx:1.5,sy:1,rho:0.4}];
let sel=0,mode='F',pc={x:2,y:1.5},px0={x:-1,y:-1};
let RG=null,pMap=null,gridOK=false,pOK=false,timer=null,pMin=0,pMax=0,pTime=0,pMass=0,gTime=0;
const stops=[[0,[68,1,84]],[0.125,[71,45,123]],[0.25,[59,82,139]],[0.375,[44,114,142]],[0.5,[33,144,140]],[0.625,[39,173,129]],[0.75,[93,200,99]],[0.875,[170,220,50]],[1,[253,231,37]]];
function cmap(t){for(let i=1;i<stops.length;i++)if(t<=stops[i][0]){const a=stops[i-1],b=stops[i],u=(t-a[0])/(b[0]-a[0]);return [0,1,2].map(k=>a[1][k]+(b[1][k]-a[1][k])*u);}return stops[stops.length-1][1];}

// ---------- mixture maths ----------
function prep(){
  const W=comps.reduce((a,c)=>a+c.w,0);
  return comps.map(c=>{
    const a=c.sx*c.sx,d=c.sy*c.sy,b=c.rho*c.sx*c.sy,tr=(a+d)/2,df=Math.sqrt((a-d)*(a-d)/4+b*b),om=1-c.rho*c.rho;
    return {w:c.w/W,mx:c.mx,my:c.my,sx:c.sx,sy:c.sy,rho:c.rho,om,sg:Math.sqrt(tr+df),sn:Math.sqrt(tr-df),
      nrm:1/(2*Math.PI*c.sx*c.sy*Math.sqrt(om))};
  });
}
function cd(k,x,y){const dx=x-k.mx,dy=y-k.my;
  return k.nrm*Math.exp(-(dx*dx/(k.sx*k.sx)-2*k.rho*dx*dy/(k.sx*k.sy)+dy*dy/(k.sy*k.sy))/(2*k.om));}
function dens(M,x,y){let s=0;for(const k of M)s+=k.w*cd(k,x,y);return s;}
function bbox(M){let a=1e9,b=-1e9,c=1e9,d=-1e9;
  for(const k of M){a=Math.min(a,k.mx-6*k.sx);b=Math.max(b,k.mx+6*k.sx);c=Math.min(c,k.my-6*k.sy);d=Math.max(d,k.my+6*k.sy);}
  return [a,b,c,d];}
// radius r with mixture P(|X-c|<=r)=p. Rings around c; each component is only sampled on the
// angular window where it has mass, and the components' ring masses are simply added.
function solveR(M,cx,cy,p,m){
  let r0=1e9,R=0,dr=1e9;
  for(const k of M){k.d=Math.hypot(cx-k.mx,cy-k.my);k.th=Math.atan2(k.my-cy,k.mx-cx);
    r0=Math.min(r0,Math.max(0,k.d-6*k.sg));R=Math.max(R,k.d+6*k.sg);dr=Math.min(dr,k.sn/(3*m));}
  const NR=Math.min(600,Math.ceil((R-r0)/dr)),h=(R-r0)/NR;
  let F=0;
  for(let i=0;i<NR;i++){
    const rho=r0+(i+0.5)*h;let ring=0;
    for(const k of M){
      let D;
      if(k.d<1e-9){if(rho>6*k.sg)continue;D=Math.PI;}
      else{const q=(rho*rho+k.d*k.d-36*k.sg*k.sg)/(2*rho*k.d);if(q>=1)continue;D=q<=-1?Math.PI:Math.acos(q);}
      const nt=Math.ceil((D>=Math.PI?48:28)*m),st=2*D/nt;let s=0;
      for(let j=0;j<nt;j++){const t=k.th-D+(j+0.5)*st;s+=cd(k,cx+rho*Math.cos(t),cy+rho*Math.sin(t));}
      ring+=k.w*s*st*rho;
    }
    const prev=F;F+=ring*h;
    if(F>=p)return r0+i*h+h*(p-prev)/(ring*h);
  }
  return R;
}
// table of r(c) on a grid covering the view and the mixture; bilinear interpolation afterwards
function buildGrid(){
  const t0=performance.now(),M=prep(),bb=bbox(M),p=+$('p').value,N=72;
  const x0=Math.min(bb[0],-L),x1=Math.max(bb[1],L),y0=Math.min(bb[2],-L),y1=Math.max(bb[3],L);
  RG={x0,y0,hx:(x1-x0)/(N-1),hy:(y1-y0)/(N-1),N,r:new Float32Array(N*N)};
  for(let j=0;j<N;j++)for(let i=0;i<N;i++)RG.r[j*N+i]=solveR(M,x0+i*RG.hx,y0+j*RG.hy,p,1);
  gTime=performance.now()-t0;gridOK=true;
}
function rAt(x,y){
  const N=RG.N,u=Math.min(N-1.001,Math.max(0,(x-RG.x0)/RG.hx)),v=Math.min(N-1.001,Math.max(0,(y-RG.y0)/RG.hy));
  const i=Math.floor(u),j=Math.floor(v),fu=u-i,fv=v-j,g=(a,b)=>RG.r[b*N+a];
  return (g(i,j)*(1-fu)+g(i+1,j)*fu)*(1-fv)+(g(i,j+1)*(1-fu)+g(i+1,j+1)*fu)*fv;
}
// reverse ball of x: along each ray from x find where |x-c| = r(c); also checks the segment property
function reverseBall(x){
  const N=180,step=0.1,tmax=24,ts=[];let viol=0;
  for(let k=0;k<N;k++){
    const ux=Math.cos(2*Math.PI*k/N),uy=Math.sin(2*Math.PI*k/N),g=t=>rAt(x.x+t*ux,x.y+t*uy)-t;
    let first=null;
    for(let t=step;t<=tmax;t+=step){
      const gv=g(t);
      if(first===null&&gv<0){let lo=t-step,hi=t;for(let it=0;it<20;it++){const m=(lo+hi)/2;if(g(m)>=0)lo=m;else hi=m;}first=(lo+hi)/2;}
      else if(first!==null&&gv>=0){viol++;break;}
    }
    ts.push(first===null?tmax:first);
  }
  return {ts,N,viol};
}
// p-occurrence of every x: each c adds f(c)dA to all x within r(c) (disc splatting, row difference array)
function computeP(){
  const t0=performance.now(),M=prep(),bb=bbox(M);
  const nx=Math.min(320,Math.ceil((bb[1]-bb[0])/(RG.hx/2))),ny=Math.min(320,Math.ceil((bb[3]-bb[2])/(RG.hy/2)));
  const hcx=(bb[1]-bb[0])/nx,hcy=(bb[3]-bb[2])/ny,H=2*L/GX,W1=GX+1,diff=new Float64Array(GX*W1);let tot=0;
  for(let a=0;a<ny;a++)for(let b=0;b<nx;b++){
    const cx=bb[0]+(b+0.5)*hcx,cy=bb[2]+(a+0.5)*hcy,wt=dens(M,cx,cy)*hcx*hcy;
    if(wt<1e-10)continue;
    tot+=wt;const r=rAt(cx,cy);
    const j0=Math.max(0,Math.ceil((cy-r+L)/H-0.5)),j1=Math.min(GX-1,Math.floor((cy+r+L)/H-0.5));
    for(let j=j0;j<=j1;j++){
      const dy=-L+(j+0.5)*H-cy,w=Math.sqrt(Math.max(0,r*r-dy*dy));
      const i0=Math.max(0,Math.ceil((cx-w+L)/H-0.5)),i1=Math.min(GX-1,Math.floor((cx+w+L)/H-0.5));
      if(i0<=i1){diff[j*W1+i0]+=wt;diff[j*W1+i1+1]-=wt;}
    }
  }
  pMap=new Float64Array(GX*GX);pMin=Infinity;pMax=0;
  for(let j=0;j<GX;j++){let acc=0;for(let i=0;i<GX;i++){acc+=diff[j*W1+i];pMap[j*GX+i]=acc;if(acc>pMax)pMax=acc;if(acc<pMin)pMin=acc;}}
  pMass=tot;pTime=performance.now()-t0;pOK=true;
}
function schedule(){
  clearTimeout(timer);
  timer=setTimeout(()=>{if(!gridOK)buildGrid();if(mode==='P'&&!pOK)computeP();draw();},150);
}
function invalidate(){gridOK=false;pOK=false;draw();}

// ---------- drawing ----------
function draw(){
  const M=prep(),p=+$('p').value,fw=mode==='F',rev=mode==='R',pm=mode==='P';
  const W=cv.clientWidth,dpr=window.devicePixelRatio||1;
  if(cv.width!==Math.round(W*dpr))cv.width=cv.height=Math.round(W*dpr);
  const usePM=pm&&pMap,G=usePM?GX:140,off=document.createElement('canvas');off.width=off.height=G;
  const oc=off.getContext('2d'),img=oc.createImageData(G,G),vals=new Float32Array(G*G);let mx=0;
  for(let j=0;j<G;j++)for(let i=0;i<G;i++){
    const v=usePM?pMap[(G-1-j)*G+i]:dens(M,-L+(i+0.5)*2*L/G,L-(j+0.5)*2*L/G);
    vals[j*G+i]=v;if(v>mx)mx=v;
  }
  for(let k=0;k<G*G;k++){const col=cmap(usePM?(vals[k]-pMin)/((pMax-pMin)||1):Math.pow(vals[k]/mx,0.7));
    img.data[k*4]=col[0];img.data[k*4+1]=col[1];img.data[k*4+2]=col[2];img.data[k*4+3]=255;}
  oc.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.drawImage(off,0,0,cv.width,cv.height);
  const S=cv.width/(2*L),X=x=>(x+L)*S,Y=y=>(L-y)*S;
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(X(0),0);ctx.lineTo(X(0),cv.height);ctx.moveTo(0,Y(0));ctx.lineTo(cv.width,Y(0));ctx.stroke();
  ctx.font=`${12*dpr}px system-ui,sans-serif`;
  const dot=(pt,fill,stroke,lab)=>{ctx.beginPath();ctx.arc(X(pt.x),Y(pt.y),6*dpr,0,2*Math.PI);ctx.fillStyle=fill;ctx.fill();
    ctx.lineWidth=2*dpr;ctx.strokeStyle=stroke;ctx.stroke();ctx.fillStyle='#fff';ctx.fillText(lab,X(pt.x)+9*dpr,Y(pt.y)-8*dpr);};
  let rad='–',info='';
  if(fw){
    const t0=performance.now(),r=solveR(M,pc.x,pc.y,p,2);
    ctx.beginPath();ctx.arc(X(pc.x),Y(pc.y),r*S,0,2*Math.PI);ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fill();
    ctx.lineWidth=2.5*dpr;ctx.strokeStyle='#fff';ctx.stroke();
    rad=r.toFixed(3);info=`c = (${pc.x.toFixed(2)}, ${pc.y.toFixed(2)}), ${comps.length} component(s), solved in ${(performance.now()-t0).toFixed(0)} ms.`;
    if(comps.length===1&&Math.abs(pc.x-comps[0].mx)<0.05&&Math.abs(pc.y-comps[0].my)<0.05&&comps[0].sx===comps[0].sy&&comps[0].rho===0)
      info+=` Exact (round, c = mean): ${(comps[0].sx*Math.sqrt(-2*Math.log(1-p))).toFixed(3)}`;
  }
  if(rev){
    if(!gridOK){schedule();rad='…';info='Updating r(c) table…';}
    else{
      const rb=reverseBall(px0);ctx.beginPath();
      rb.ts.forEach((t,k)=>{const a=2*Math.PI*k/rb.N,x=X(px0.x+t*Math.cos(a)),y=Y(px0.y+t*Math.sin(a));k?ctx.lineTo(x,y):ctx.moveTo(x,y);});
      ctx.closePath();ctx.fillStyle='rgba(255,79,163,0.2)';ctx.fill();ctx.lineWidth=2.5*dpr;ctx.strokeStyle='#ff4fa3';ctx.stroke();
      let mass=0;for(let k=0;k<rb.N;k++){const a=2*Math.PI*k/rb.N,ux=Math.cos(a),uy=Math.sin(a),T=rb.ts[k],ns=Math.max(20,Math.ceil(T/0.05)),ds=T/ns;let s2=0;for(let q=0;q<ns;q++){const s=(q+0.5)*ds;s2+=dens(M,px0.x+s*ux,px0.y+s*uy)*s;}mass+=s2*ds*(2*Math.PI/rb.N);}
      rad=mass.toFixed(4);
      info=`x = (${px0.x.toFixed(2)}, ${px0.y.toFixed(2)}). Distance from x to boundary: ${Math.min(...rb.ts).toFixed(2)} to ${Math.max(...rb.ts).toFixed(2)}. `+
        (rb.viol===0?'Segment property holds along every ray checked.':`Segment property fails along ${rb.viol} of ${rb.N} rays (boundary there is the first crossing).`);
    }
  }
  if(pm){
    if(!pOK){schedule();rad='…';info='Computing p-occurrence map…';}
    else{
      const H=2*L/GX,ii=Math.min(GX-1,Math.max(0,Math.floor((px0.x+L)/H))),jj=Math.min(GX-1,Math.max(0,Math.floor((px0.y+L)/H)));
      rad=pMap[jj*GX+ii].toFixed(4);
      info=`x = (${px0.x.toFixed(2)}, ${px0.y.toFixed(2)}). Map range ${pMin.toFixed(4)} to ${pMax.toFixed(4)} (colours stretched min to max). r(c) table ${gTime.toFixed(0)} ms + map ${pTime.toFixed(0)} ms; mass covered ${pMass.toFixed(5)}.`;
      const lv=+$('cont').value;
      if(lv>0){
        const Hh=2*L/GX;let n=0;ctx.beginPath();
        for(let j=0;j<GX-1;j++)for(let i=0;i<GX-1;i++){
          const va=pMap[j*GX+i],vb=pMap[j*GX+i+1],vc=pMap[(j+1)*GX+i+1],vd=pMap[(j+1)*GX+i];
          const pts=[],x0=-L+(i+0.5)*Hh,y0=-L+(j+0.5)*Hh;
          const cr=(u,v,ax,ay,bx,by)=>{if((u<lv)!==(v<lv)){const t=(lv-u)/(v-u);pts.push([ax+(bx-ax)*t,ay+(by-ay)*t]);}};
          cr(va,vb,x0,y0,x0+Hh,y0);cr(vb,vc,x0+Hh,y0,x0+Hh,y0+Hh);cr(vd,vc,x0,y0+Hh,x0+Hh,y0+Hh);cr(va,vd,x0,y0,x0,y0+Hh);
          for(let k=0;k+1<pts.length;k+=2){ctx.moveTo(X(pts[k][0]),Y(pts[k][1]));ctx.lineTo(X(pts[k+1][0]),Y(pts[k+1][1]));n++;}
        }
        ctx.lineWidth=2*dpr;ctx.strokeStyle='#fff';ctx.setLineDash([6*dpr,4*dpr]);ctx.stroke();ctx.setLineDash([]);
        info+=n?` White dashed line: level ${lv.toFixed(2)}.`:` No point reaches level ${lv.toFixed(2)}.`;
      }
    }
  }
  // component means
  comps.forEach((c,i)=>{
    const m=(i===sel?8:5)*dpr;ctx.strokeStyle=i===sel?'#ff4d3d':'rgba(255,77,61,0.75)';ctx.lineWidth=2*dpr;
    ctx.beginPath();ctx.moveTo(X(c.mx)-m,Y(c.my)-m);ctx.lineTo(X(c.mx)+m,Y(c.my)+m);ctx.moveTo(X(c.mx)-m,Y(c.my)+m);ctx.lineTo(X(c.mx)+m,Y(c.my)-m);ctx.stroke();
    if(comps.length>1){ctx.fillStyle='#ff4d3d';ctx.fillText(String(i+1),X(c.mx)+9*dpr,Y(c.my)+16*dpr);}
  });
  if(fw)dot(pc,'#fff','#e8590c','c');else dot(px0,'#ff4fa3','#fff','x');
  $('lab').textContent=(rev||pm)?'p-occurrence of x':'Radius';
  $('rad').textContent=rad;$('info').textContent=info;
  const c=comps[sel],Wt=comps.reduce((a,k)=>a+k.w,0);
  $('cl').style.display=pm?'':'none';$('vz').textContent='±'+L;$('vc').textContent=(+$('cont').value)>0?(+$('cont').value).toFixed(2):'off';
  $('vp').textContent=p.toFixed(2);$('vw').textContent=(100*c.w/Wt).toFixed(0)+'%';
  $('vmx').textContent=c.mx.toFixed(1);$('vmy').textContent=c.my.toFixed(1);
  $('vsx').textContent=c.sx.toFixed(1);$('vsy').textContent=c.sy.toFixed(1);$('vrho').textContent=c.rho.toFixed(2);
}

// ---------- UI ----------
function renderChips(){
  $('chips').innerHTML=comps.map((c,i)=>`<button data-i="${i}" class="${i===sel?'on':''}">G${i+1}</button>`).join('');
  $('del').disabled=comps.length===1;$('add').disabled=comps.length>=MAXK;
}
function loadSliders(){const c=comps[sel];['w','mx','my','sx','sy','rho'].forEach(k=>$(k).value=c[k]);}
$('chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sel=+b.dataset.i;renderChips();loadSliders();draw();});
$('add').onclick=()=>{const n=comps.length;comps.push({w:1,mx:((n*2.3)%6)-3,my:((n*1.7)%6)-3,sx:1,sy:1,rho:0});sel=n;renderChips();loadSliders();invalidate();};
$('del').onclick=()=>{comps.splice(sel,1);sel=Math.min(sel,comps.length-1);renderChips();loadSliders();invalidate();};
['w','mx','my','sx','sy','rho'].forEach(k=>$(k).addEventListener('input',()=>{comps[sel][k]=+$(k).value;invalidate();}));
$('p').addEventListener('input',invalidate);
$('cont').addEventListener('input',draw);
$('zoom').addEventListener('input',()=>{L=+$('zoom').value;invalidate();});
$('modes').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;
  [...$('modes').children].forEach(x=>x.className=x===b?'on':'');draw();});
let drag=false;
function move(e){
  const r=cv.getBoundingClientRect(),pt=mode==='F'?pc:px0;
  pt.x=Math.max(-L,Math.min(L,(e.clientX-r.left)/r.width*2*L-L));
  pt.y=Math.max(-L,Math.min(L,L-(e.clientY-r.top)/r.height*2*L));draw();
}
cv.addEventListener('pointerdown',e=>{drag=true;cv.setPointerCapture(e.pointerId);move(e);});
cv.addEventListener('pointermove',e=>{if(drag)move(e);});
cv.addEventListener('pointerup',()=>drag=false);
cv.addEventListener('pointercancel',()=>drag=false);
window.addEventListener('resize',draw);
renderChips();loadSliders();draw();
</script>
</body>
</html>
